[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "voice-type"
version = "0.1.0"
description = "Voice-to-text dictation tool with AI refinement"
license = {text = "GPL-3.0-or-later"}
requires-python = ">=3.10"
dependencies = [
    "PySide6>=6.8",
    "sounddevice>=0.4",
    "numpy>=1.24,<3.0",
    "soundfile>=0.12",
    "openai>=1.40,<2.0",
    "pydantic>=2.0",
    "pyperclip>=1.8",
    "pynput>=1.7",
]

[project.scripts]
voice-type = "voicetype.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["voicetype*"]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-qt>=4.0",
    "pytest-mock>=3.0",
]

[tool.pytest.ini_options]
# Silence the harmless Pydantic V1 compatibility warning emitted by
# openai/_compat.py on Python 3.14+. The user-installed `openai` package still
# imports `pydantic.v1.typing` as a compatibility shim — once openai removes
# that path upstream this filter can be removed.
filterwarnings = [
    "ignore:Core Pydantic V1 functionality isn't compatible with Python 3.14 or greater:UserWarning",
]
